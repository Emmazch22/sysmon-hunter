# Alembic configuration.
#
# The database URL is deliberately NOT set here. It is read from the application
# settings at runtime (see migrations/env.py), so there is exactly one place that
# knows where the database lives -- backend/config.py. Duplicating the URL into
# this file is how a migration ends up being applied to the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, descriptive revision filenames. The default is a bare hash, which
# tells you nothing when scanning the directory six months later.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S