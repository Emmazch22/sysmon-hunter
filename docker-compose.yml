# Sysmon Hunter — local stack.
#
#   docker compose up --build
#
# Console:  http://localhost:8000
# API docs: http://localhost:8000/api/docs

services:
  engine:
    build: .
    image: sysmon-hunter:latest
    container_name: sysmon-hunter

    ports:
      # Bound to all interfaces on purpose: a Winlogbeat agent on a lab VM has
      # to be able to reach the ingest endpoint from another host on the network.
      - "8000:8000"

    volumes:
      # Detections and incidents are evidence. They live on a named volume so a
      # rebuild of the image does not throw away the findings.
      - hunter-data:/app/data

      # Rules are content, not code. Mounting them means a rule can be written,
      # saved and reloaded without rebuilding the image -- which is the whole
      # detection-engineering loop, and it should not require a Docker build.
      - ./rules:/app/rules:ro

    environment:
      # Settings use the HUNTER_ prefix (see backend/config.py). Anything in
      # Settings can be overridden here without touching code.
      HUNTER_DB_URL: sqlite+aiosqlite:////app/data/hunter.db

      # Correlation tuning. These defaults suit a quiet lab; a noisy production
      # endpoint usually wants a higher threshold.
      # HUNTER_INCIDENT_SCORE_THRESHOLD: 12
      # HUNTER_CORRELATION_WINDOW_MINUTES: 10
      # HUNTER_BEACON_REGULARITY_THRESHOLD: 0.75

    restart: unless-stopped

volumes:
  hunter-data: