id: SYS-135
title: Non-browser process touched a browser credential database
event_id: 11
severity: high
attack: [T1555.003]
description: >
  A process that is not the browser itself created or overwrote a file named
  exactly like a Chromium-family credential store -- "Login Data", "Cookies",
  or "Web Data" (Chrome, Edge, and Brave all use these three filenames
  under their own profile folders). Sysmon has no generic "file opened for
  read" event, so this cannot see a process that only reads the database in
  place; what it can see is a process other than the browser writing to that
  exact filename, which is what every credential-stealer that stages a copy
  before parsing it actually does. Nothing legitimate but the browser itself
  should ever write a file with this name, regardless of which directory it
  lands in -- see SYS-137 for the complementary, location-based version of
  this same check (files ending up in a staging directory, whoever wrote
  them).
detection:
  TargetFilename|endswith:
    - '\Login Data'
    - '\Cookies'
    - '\Web Data'
  image|endswith|not:
    - '\chrome.exe'
    - '\msedge.exe'
    - '\brave.exe'
    - '\firefox.exe'
    - '\opera.exe'
condition: all
