id: SYS-169
title: Script interpreter staged a cloud CLI credential file
event_id: 11
severity: critical
attack: [T1552.001]
description: >
  AWS, Azure, and Google Cloud all cache long-lived credentials on disk once
  their CLI has been configured -- AWS's `.aws\credentials`, Azure's
  `.azure\accessTokens.json`/`azureProfile.json`, and gcloud's
  `application_default_credentials.json`/`credentials.db`, plus
  `.docker\config.json` (registry credentials, sometimes cloud-registry
  tokens) and `.kube\config` (a Kubernetes cluster's own admin credentials).
  Sysmon has no file-read event, so this cannot see the file being opened in
  place -- what it can see, the same way SYS-135/SYS-136 do for browser and
  KeePass credential stores, is a script interpreter or LOLBin writing,
  copying, or overwriting one of these exact paths, consistent with staging
  a copy to exfiltrate or parse elsewhere. A stolen cloud CLI credential is
  not a foothold on one host, it is standing access to the whole cloud
  account or Kubernetes cluster it was scoped to -- scored critical, not
  high, for that reason.
detection:
  TargetFilename|endswith:
    - '\.aws\credentials'
    - '\.azure\accessTokens.json'
    - '\.azure\azureProfile.json'
    - '\gcloud\application_default_credentials.json'
    - '\gcloud\credentials.db'
    - '\.docker\config.json'
    - '\.kube\config'
  image|endswith:
    - '\powershell.exe'
    - '\cmd.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\rundll32.exe'
condition: all
