id: SYS-098
title: Archive utility invoked with a password, staging data for exfiltration
event_id: 1
severity: medium
attack: [T1560.001]
description: >
  rar, 7z, or winrar ran with a password flag. Compressing a batch of files
  before moving them off a host is routine; adding a password to that
  archive serves no legitimate backup purpose and is a documented step for
  getting staged data past content-inspecting egress controls intact. On its
  own this is a lead worth a glance at what got archived and where it went
  next, not a verdict.
detection:
  image|endswith:
    - '\rar.exe'
    - '\winrar.exe'
    - '\7z.exe'
    - '\7za.exe'
  command_line|re: '(?<!\S)-p\S'
condition: all
