id: SYS-186
title: Registry queried for an autologon or default password
event_id: 1
severity: high
attack: [T1552.002]
description: >
  reg.exe queried DefaultPassword or AltDefaultPassword under
  HKLM\...\Winlogon -- exactly where a plaintext password sits when
  autologon is configured. This is offline, no-tool-download credential
  theft: the value is stored in cleartext by design so Windows can log the
  account in without a prompt, and any process with registry read access
  can retrieve it.
detection:
  image|endswith: '\reg.exe'
  command_line|re: '(?=.*\bquery\b)(?=.*\bwinlogon\b)(?=.*(defaultpassword|altdefaultpassword))'
condition: all
