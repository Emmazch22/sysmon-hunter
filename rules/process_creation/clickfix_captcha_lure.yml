id: SYS-151
title: ClickFix/FileFix decoy verification lure pasted from Explorer
event_id: 1
severity: high
attack: [T1204.004, T1204.001]
description: >
  ClickFix (and its File Explorer address-bar sibling, FileFix) tricks a user
  into pressing Win+R (or opening a folder path), pasting attacker-controlled
  clipboard content, and hitting Enter -- a fake CAPTCHA or "verify you are
  human" page walks them through it. Because the command runs from the Run
  dialog or the address bar, its parent is always explorer.exe, which is what
  makes it look legitimate to a user and is exactly the forensic tell that
  gives it away: nobody's normal workflow launches a shell from Explorer.

  The payload itself almost always carries a `#`-prefixed comment stuffed
  with decoy verification text (a fake CAPTCHA ID, "I am not a robot", a
  case number) -- padding whose real purpose is to push the actual malicious
  command off the right edge of the Run dialog so the victim never sees it.
  That combination -- explorer-spawned, comment marker present, lure keyword
  present -- is what SigmaHQ's own ClickFix/FileFix rule keys on, and is
  reproduced here as a single regex lookahead pair rather than two selections,
  since this engine's rule schema has no grouped-selection concept: a field
  spec can only ever be one operator against one field.
detection:
  parent_image|endswith: '\explorer.exe'
  command_line|re: '(?=.*#)(?=.*\b(?:account|anti-?bot|botcheck|captcha|challenge|confirmation|fraud|human|identification|identity|not\s+a\s+robot|robot|validation|verification|verify)\b)'
condition: all
