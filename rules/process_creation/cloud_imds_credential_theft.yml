id: SYS-170
title: Cloud instance metadata service queried by a non-agent process
event_id: 1
severity: critical
attack: [T1552.005]
description: >
  169.254.169.254 is the link-local address every major cloud provider
  (AWS, Azure, GCP, Alibaba) exposes its Instance Metadata Service on, and
  on AWS and Azure that service hands out live, temporary credentials for
  whatever IAM role or managed identity the instance runs as -- no
  authentication beyond being able to reach the address at all. This is the
  exact pivot an SSRF-to-cloud-account-takeover chain depends on (the 2019
  Capital One breach is among the best-documented examples): a request to
  this address from curl or a PowerShell web-request cmdlet, rather than
  the cloud provider's own guest agent, is consistent with a compromised
  process reaching for those credentials directly. Scored critical: a
  successful hit hands over live cloud-account credentials, not just host
  access.
detection:
  image|endswith:
    - '\curl.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
  command_line|contains: '169.254.169.254'
condition: all
