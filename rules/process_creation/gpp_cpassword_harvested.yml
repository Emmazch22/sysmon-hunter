id: SYS-187
title: Group Policy Preferences cpassword harvested
event_id: 1
severity: critical
attack: [T1552.006]
description: >
  A command line referenced cpassword (the encrypted-then-published
  password field Group Policy Preferences XML files carried until MS14-025)
  or invoked Get-GPPPassword, the standard PowerSploit/PowerView tool for
  finding and decrypting it. Microsoft published the AES key used to
  "encrypt" cpassword in the GPP schema documentation, so any authenticated
  domain user who can read SYSVOL -- which is everyone, by default -- can
  recover the plaintext. Old GPOs created before the 2014 patch, or ones
  simply never cleaned up, still leak this on plenty of real networks.
detection:
  image|endswith:
    - '\findstr.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\cmd.exe'
  command_line|re: 'cpassword|get-gpppassword'
condition: all
