id: SYS-183
title: Mimikatz used to dump LSA secrets or cached domain credentials
event_id: 1
severity: critical
attack: [T1003.004, T1003.005]
description: >
  lsadump::secrets (LSA secrets -- service account passwords, auto-logon
  credentials, and other plaintext material LSA stores for its own use)
  or lsadump::cache (domain credentials cached locally so a laptop can
  authenticate offline) named directly on the command line. Neither is in
  SYS-131's module list, and neither is what SYS-108 (reg.exe saving the
  SAM/SYSTEM/SECURITY hives for offline extraction) or SYS-041/SYS-010
  (LSASS memory access) already catch -- this is Mimikatz reading the
  live in-memory LSA secrets store directly, the same "overlay a specific
  command onto a generic tool signature" pattern SYS-164 already uses.
detection:
  command_line|re: 'lsadump::secrets|lsadump::cache'
condition: all
