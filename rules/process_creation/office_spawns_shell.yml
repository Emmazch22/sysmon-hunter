id: SYS-001
title: Office application spawned a command interpreter
event_id: 1
severity: high
attack: [T1566.001, T1059]
description: >
  An Office product created a shell or scripting child process, the classic
  signature of a malicious macro following a phishing delivery.
detection:
  parent_image|endswith:
    - '\winword.exe'
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\outlook.exe'
  image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    - '\cscript.exe'
    - '\mshta.exe'
condition: all
