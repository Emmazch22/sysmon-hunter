id: SYS-238
title: A value under LSA Secrets was written
event_id: 13
severity: medium
attack: [T1003.004]
description: >
  A value was written under HKLM\SECURITY\Policy\Secrets, the branch that
  holds every DPAPI-protected LSA secret on the box -- service account
  passwords, the machine account password ($MACHINE.ACC), cached
  auto-logon credentials, and more. Tools like mimikatz's `lsadump::secrets`
  and secretsdump.py read this branch to recover plaintext credentials
  without ever touching lsass's live memory. Medium rather than high
  because lsass.exe legitimately rewrites $MACHINE.ACC on its own ~30-day
  rotation schedule, so this alone is a correlation signal, not a verdict
  -- weigh it against which secret name was touched and by what.
detection:
  TargetObject|contains: '\SECURITY\Policy\Secrets\'
condition: all
