id: SYS-071
title: WMI event consumer registered for code execution
event_id: 20
severity: high
attack: [T1546.003]
description: >
  A WmiEventConsumer was registered as a CommandLineEventConsumer or
  ActiveScriptEventConsumer -- the two consumer types that run arbitrary
  commands or script when their bound filter fires. This is the standard
  fileless persistence mechanism: no scheduled task, no run key, no service,
  just a WMI subscription that survives reboot and re-executes on its trigger
  (commonly "process started" or "every N seconds"). Legitimate software
  occasionally registers CommandLineEventConsumers too, so this is a lead to
  correlate against what Destination actually runs, not an automatic verdict.
detection:
  Type|equals:
    - CommandLineEventConsumer
    - ActiveScriptEventConsumer
condition: all
